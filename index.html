<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘看山的选择——人生样本交换所</title>
<meta name="description" content="记录你第一次只为自己心之所向做出的选择。越轨是一种勇气，坚守初心也是一种选择。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.css">
<style>
/* ===== 设计系统 tokens · 「纸本档案馆 · 春日光」 ===== */
:root {
  /* 纸与光 */
  --bg: #fbf6ec;
  --paper: #fffdf7;
  --paper-deep: #f6efe0;
  --paper-edge: #efe5d1;
  --surface: #ffffff;

  /* 墨色层次 */
  --ink-strong: #2c2823;
  --text: #3a352d;
  --ink: #4a443a;
  --muted: #8a8171;
  --subtle: #79705f;

  /* 纸边与分隔 */
  --line: rgba(120, 100, 68, 0.22);
  --line-soft: rgba(120, 100, 68, 0.12);
  --line-hair: rgba(120, 100, 68, 0.07);

  /* 品牌蓝（知乎蓝，色值不可替换） */
  --brand: #0066ff;
  --brand-hover: #0052cc;
  --brand-soft: #edf3ff;
  --brand-mist: rgba(0, 102, 255, 0.07);
  --brand-ink: #0b4bb8;

  /* 守住初心：与蓝等重的春绿 */
  --stay-color: #2d7a4f;
  --stay-hover: #24653f;
  --stay-soft: #ecf6ef;
  --stay-mist: rgba(45, 122, 79, 0.08);
  --stay-ink: #1f5e3b;

  /* 人与人：火漆红棕 */
  --seal: #a54c36;
  --seal-deep: #8b3c29;
  --seal-soft: #fdf2ed;

  /* 春光辅助 */
  --warm: #f7f0e2;
  --warm-deep: #f1e7d4;
  --sky: #cfe6ee;
  --dawn: #ffd9a8;
  --bloom: #f7d5d8;
  --sprout: #d8e8cf;
  --gold: #d8b169;

  /* 圆角 */
  --radius-sm: 10px;
  --radius-md: 15px;
  --radius-lg: 20px;
  --radius-xl: 26px;

  /* 影：暖调低垂 */
  --shadow-rest: 0 1px 2px rgba(120, 98, 64, 0.05), 0 5px 18px rgba(120, 98, 64, 0.06);
  --shadow-lift: 0 3px 6px rgba(120, 98, 64, 0.07), 0 18px 44px rgba(120, 98, 64, 0.13);
  --shadow-deep: 0 30px 74px rgba(104, 82, 50, 0.20);
  --shadow-inset-paper: inset 0 1px 0 rgba(255, 255, 255, 0.85);

  /* 动效节拍 */
  --ease-glide: cubic-bezier(0.19, 1, 0.22, 1);
  --ease-soft: cubic-bezier(0.25, 0.8, 0.35, 1);
  --ease-elastic: cubic-bezier(0.34, 1.4, 0.5, 1);
  --dur-quick: 180ms;
  --dur-base: 400ms;
  --dur-slow: 680ms;

  /* 字体 */
  --font-hand: "LXGW WenKai Screen", "霞鹜文楷", "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }

html, body {
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.65;
}

body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 8% 1%, rgba(255, 217, 168, 0.34), transparent 30rem),
    radial-gradient(circle at 94% 3%, rgba(207, 230, 238, 0.40), transparent 27rem),
    radial-gradient(circle at 74% 97%, rgba(216, 232, 207, 0.26), transparent 28rem),
    linear-gradient(170deg, #fffdf7 0%, #fbf5e9 48%, #fdfaf1 100%);
  background-attachment: fixed;
}

/* 纸张颗粒 + 极细纤维横纹 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.16;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(circle at 17px 23px, rgba(110, 92, 62, 0.22) 0 0.8px, transparent 1.1px),
    radial-gradient(circle at 68px 81px, rgba(110, 92, 62, 0.14) 0 0.7px, transparent 1px),
    repeating-linear-gradient(0deg, rgba(120, 100, 68, 0.05) 0 1px, transparent 1px 7px);
  background-size: 94px 94px, 131px 131px, 100% 7px;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
img { max-width: 100%; }

/* 无障碍：键盘焦点统一可见 */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
  border-radius: 6px;
}

::selection { background: rgba(0, 102, 255, 0.14); }

/* ===== 春日天空层 ===== */
.sky-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sky-cloud {
  position: absolute;
  border-radius: 999px;
  background: rgba(255, 255, 252, 0.72);
  box-shadow:
    inset 0 -9px 18px rgba(166, 134, 90, 0.06),
    0 18px 42px rgba(120, 138, 150, 0.07);
  opacity: 0.58;
  animation: cloudDrift 26s ease-in-out infinite;
}
.sky-cloud::before, .sky-cloud::after {
  content: ""; position: absolute; border-radius: 999px; background: inherit;
}
.sky-cloud::before { width: 58%; height: 190%; left: 14%; top: -88%; }
.sky-cloud::after  { width: 46%; height: 160%; right: 12%; top: -64%; }
.sky-cloud.c1 { width: 250px; height: 58px; top: 11%; left: -8%;  animation-duration: 28s; }
.sky-cloud.c2 { width: 178px; height: 42px; top: 44%; right: -6%; animation-duration: 33s; animation-delay: -7s; opacity: 0.42; }
.sky-cloud.c3 { width: 210px; height: 50px; top: 76%; left: 6%;   animation-duration: 30s; animation-delay: -14s; opacity: 0.34; }

.sky-glow { position: absolute; border-radius: 999px; filter: blur(2px); animation: glowFloat 8s ease-in-out infinite; }
.sky-glow.g1 {
  width: 320px; height: 320px; top: -90px; right: -70px;
  max-width: 60vw;
  background: radial-gradient(circle, rgba(255, 209, 152, 0.32), transparent 68%);
}
.sky-glow.g2 {
  width: 240px; height: 240px; bottom: 3%; left: -80px;
  max-width: 60vw;
  background: radial-gradient(circle, rgba(196, 226, 235, 0.34), transparent 68%);
  animation-delay: -3.2s;
}

@keyframes cloudDrift {
  0%, 100% { transform: translateX(0) translateY(0); }
  50%      { transform: translateX(52px) translateY(-10px); }
}
@keyframes glowFloat {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
  50%      { transform: translateY(-16px) scale(1.05); opacity: 1; }
}
@keyframes softFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(15px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.05); }
}
@keyframes sealPress {
  0%   { opacity: 0; transform: rotate(-24deg) scale(1.5); }
  60%  { opacity: 1; transform: rotate(-9deg) scale(0.97); }
  100% { opacity: 1; transform: rotate(-9deg) scale(1); }
}
@keyframes inkFill {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}
@keyframes dotWave {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
  30%           { transform: translateY(-4px); opacity: 1; }
}

/* ===== 布局 ===== */
.page {
  max-width: 976px;
  margin: 0 auto;
  padding: 28px 22px 92px;
  position: relative;
  z-index: 1;
  animation: riseIn var(--dur-slow) var(--ease-soft) both;
}

/* ===== 顶部导航：档案馆门牌 ===== */
.header {
  background: rgba(255, 253, 247, 0.88);
  backdrop-filter: blur(16px) saturate(1.1);
  -webkit-backdrop-filter: blur(16px) saturate(1.1);
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  top: 0;
  z-index: 20;
}
/* 门牌下沿的一道双色线：蓝与绿等长 */
.header::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px;
  background: linear-gradient(90deg,
    var(--brand) 0%, rgba(0, 102, 255, 0.35) 42%,
    var(--line-soft) 46%, var(--line-soft) 54%,
    rgba(45, 122, 79, 0.35) 58%, var(--stay-color) 100%);
  opacity: 0.5;
}
.header-inner {
  max-width: 976px; margin: 0 auto;
  padding: 11px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.header-brand {
  display: flex; align-items: center; gap: 11px; cursor: pointer;
  transition: transform var(--dur-quick) var(--ease-soft);
}
.header-brand:hover { transform: translateY(-1px); }
.header-brand .brand-mark {
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, #ffffff, var(--sky) 76%);
  border: 1px solid var(--line-soft);
  background-size: cover;
  background-position: center 62%;
  background-repeat: no-repeat;
  box-shadow: var(--shadow-rest), inset 0 0 0 2px rgba(255, 255, 255, 0.6);
}
.header-brand .brand-text { display: flex; align-items: baseline; gap: 9px; }
.header-brand .name {
  font-family: var(--font-hand);
  font-weight: 700; font-size: 17.5px; letter-spacing: 0.6px;
  white-space: nowrap; color: var(--ink-strong);
}
.header-brand .sub {
  font-size: 12px; color: var(--muted);
  letter-spacing: 1.6px; white-space: nowrap;
  padding-left: 9px; border-left: 1px solid var(--line-soft);
}
.header-nav { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.header-nav a, .header-nav button {
  position: relative;
  font-size: 14px; color: var(--muted); background: none; border: none; padding: 2px 0;
  transition: color var(--dur-quick) ease;
}
.header-nav a:not(.nav-login)::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -3px; height: 1.5px;
  background: currentColor; border-radius: 999px;
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--dur-base) var(--ease-glide);
}
.header-nav a:not(.nav-login):hover { color: var(--brand); }
.header-nav a:not(.nav-login):hover::after { transform: scaleX(1); }
.nav-login {
  padding: 6px 16px !important; border-radius: 999px;
  background: linear-gradient(135deg, var(--brand), #3d86ff);
  color: #fff !important; font-size: 13.5px; font-weight: 500;
  box-shadow: 0 4px 14px rgba(0, 102, 255, 0.22);
  transition: transform var(--dur-quick) var(--ease-soft), box-shadow var(--dur-quick) ease;
}
.nav-login:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0, 102, 255, 0.3); }

/* ===== 刘看山形象容器 ===== */
.lks {
  display: block;
  background-repeat: no-repeat;
  background-position: center bottom;
  background-size: contain;
  flex-shrink: 0;
  pointer-events: none;
}
.lks-float { animation: softFloat 4.8s ease-in-out infinite; }

.lks-stage { position: relative; display: inline-block; }
.lks-stage::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -4px;
  width: 56%; height: 9px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: radial-gradient(ellipse, rgba(122, 105, 76, 0.16), transparent 72%);
}

/* ===== 水彩插图通用 ===== */
.illus {
  display: block; width: 100%; height: 100%;
  object-fit: cover;
  background-color: var(--warm);
}
/* 插图与纸面融合：边缘柔化 + 叠一层暖色 */
.illus-frame {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-md);
  box-shadow: inset 0 0 0 1px var(--line-hair);
}
.illus-frame::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 253, 247, 0.18), transparent 34%, rgba(255, 253, 247, 0.30));
  mix-blend-mode: normal;
}

/* ===== 通用组件 ===== */
.card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  box-shadow: var(--shadow-rest);
}
.muted { color: var(--muted); }

/* 区块小标题：眉标 + 细线 */
.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; letter-spacing: 3px; font-weight: 600;
  color: var(--muted); margin-bottom: 10px;
}
.eyebrow::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line-soft), transparent);
}

.error-box {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 12px 15px;
  border: 1px solid rgba(165, 76, 54, 0.24);
  background: var(--seal-soft);
  color: #96432f;
  border-radius: var(--radius-sm);
  margin: 14px 0;
  font-size: 14px; line-height: 1.75;
  animation: riseIn var(--dur-base) var(--ease-soft) both;
}
.error-box::before {
  content: "!";
  flex-shrink: 0;
  width: 17px; height: 17px; margin-top: 3px;
  border-radius: 50%;
  background: rgba(165, 76, 54, 0.14);
  color: var(--seal);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.tag {
  display: inline-block; font-size: 12px; padding: 3.5px 11px;
  border-radius: 999px;
  background: rgba(122, 105, 76, 0.06);
  color: var(--subtle);
  border: 1px solid var(--line-hair);
  transition: background var(--dur-quick) ease, border-color var(--dur-quick) ease;
}
.tag-stay {
  background: var(--stay-soft); color: var(--stay-color);
  border-color: rgba(45, 122, 79, 0.18);
}
.tag-row { display: flex; flex-wrap: wrap; gap: 7px; }

/* ===== 按钮 ===== */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 21px; border-radius: 999px;
  border: 1px solid var(--brand);
  background: linear-gradient(135deg, var(--brand), #2b7dff);
  color: #fff;
  font-size: 14px; font-weight: 600; letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(0, 102, 255, 0.18);
  overflow: hidden;
  transition: transform var(--dur-quick) var(--ease-soft),
              box-shadow var(--dur-quick) ease,
              background var(--dur-quick) ease,
              border-color var(--dur-quick) ease,
              color var(--dur-quick) ease;
}
/* 按钮上一道扫过的光，只在 hover 时出现 */
.btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform var(--dur-slow) var(--ease-glide);
  pointer-events: none;
}
.btn:hover:not(:disabled)::after { transform: translateX(120%); }
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(0, 102, 255, 0.26);
}
.btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }

.btn-ghost {
  background: rgba(255, 255, 255, 0.92); color: var(--brand);
  box-shadow: var(--shadow-rest);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--brand-soft);
  box-shadow: 0 8px 20px rgba(0, 102, 255, 0.14);
}

.btn-quiet {
  border-color: var(--line); background: rgba(255, 255, 255, 0.88);
  color: var(--ink); font-weight: 500;
  box-shadow: var(--shadow-rest);
}
.btn-quiet:hover:not(:disabled) {
  background: var(--warm); border-color: rgba(122, 105, 76, 0.3);
  box-shadow: 0 8px 20px rgba(120, 98, 64, 0.12);
}
.btn-quiet::after { display: none; }

.btn-stay {
  border-color: var(--stay-color);
  background: linear-gradient(135deg, var(--stay-color), #3a9161);
  color: #fff;
  box-shadow: 0 4px 14px rgba(45, 122, 79, 0.2);
}
.btn-stay:hover:not(:disabled) { box-shadow: 0 10px 26px rgba(45, 122, 79, 0.28); }

/* 描边的绿按钮，与 btn-ghost 对称，保证两方等重 */
.btn-stay-ghost {
  background: rgba(255, 255, 255, 0.92);
  border-color: var(--stay-color);
  color: var(--stay-color);
  box-shadow: var(--shadow-rest);
}
.btn-stay-ghost:hover:not(:disabled) {
  background: var(--stay-soft);
  box-shadow: 0 8px 20px rgba(45, 122, 79, 0.14);
}

.btn-sm { padding: 7px 15px; font-size: 13px; }

/* 选项按钮组：写卡页的类型 / 状态 / 标签 */
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.86);
  color: var(--ink);
  font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-rest);
  transition: transform var(--dur-quick) var(--ease-soft),
              background var(--dur-quick) ease,
              border-color var(--dur-quick) ease,
              color var(--dur-quick) ease,
              box-shadow var(--dur-quick) ease;
}
.chip:hover:not(:disabled) { transform: translateY(-1px); background: var(--warm); }
.chip.is-on {
  border-color: var(--brand); color: var(--brand-ink);
  background: var(--brand-soft);
  box-shadow: 0 4px 14px rgba(0, 102, 255, 0.13);
}
.chip.is-on.stay {
  border-color: var(--stay-color); color: var(--stay-ink);
  background: var(--stay-soft);
  box-shadow: 0 4px 14px rgba(45, 122, 79, 0.14);
}
.chip .chip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--line); flex-shrink: 0;
  transition: background var(--dur-quick) ease;
}
.chip.is-on .chip-dot { background: var(--brand); }
.chip.is-on.stay .chip-dot { background: var(--stay-color); }
.chip-sm { padding: 6px 13px; font-size: 12.5px; }

/* ===== 表单字段 ===== */
.field { margin-bottom: 24px; }
.field label {
  display: block; font-size: 15px; font-weight: 600;
  margin-bottom: 5px; color: var(--ink-strong);
  font-family: var(--font-hand); letter-spacing: 0.4px;
}
.field .field-hint {
  font-size: 13px; color: var(--subtle);
  margin: 0 0 10px; line-height: 1.8;
}
.field input[type="text"], .field textarea, .field select {
  width: 100%; padding: 12px 15px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background:
    repeating-linear-gradient(to bottom,
      rgba(255, 255, 255, 0.95) 0 30px,
      rgba(120, 100, 68, 0.045) 30px 31px);
  font-family: inherit; font-size: 15px;
  line-height: 31px; color: var(--text); resize: vertical;
  transition: border-color var(--dur-quick) ease,
              box-shadow var(--dur-quick) ease,
              background-color var(--dur-quick) ease;
}
.field input[type="text"] { line-height: 1.7; background: rgba(255, 255, 255, 0.95); }
.field input[type="text"]::placeholder, .field textarea::placeholder { color: #bbb1a0; }
.field input[type="text"]:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 4px var(--brand-mist);
}
.field.stay-focus input[type="text"]:focus,
.field.stay-focus textarea:focus {
  border-color: var(--stay-color);
  box-shadow: 0 0 0 4px var(--stay-mist);
}

/* 写卡页字段组：像一叠表单纸 */
.form-sheet {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 30px 28px 26px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  margin-top: 26px;
}
/* 表单纸左侧的装订孔 */
.form-sheet::before {
  content: "";
  position: absolute; left: 11px; top: 34px; bottom: 34px; width: 4px;
  background-image: radial-gradient(circle, rgba(122, 105, 76, 0.18) 0 2px, transparent 2.2px);
  background-size: 4px 34px;
  background-repeat: repeat-y;
  opacity: 0.75;
  pointer-events: none;
}
.form-sheet > * { position: relative; }
.form-sheet .form-group {
  padding-left: 14px;
  border-top: 1px dashed var(--line-hair);
  padding-top: 24px;
  margin-top: 4px;
}
.form-sheet .form-group:first-of-type { border-top: none; padding-top: 0; }
.form-group-title {
  font-family: var(--font-hand);
  font-size: 13px; letter-spacing: 2.5px; color: var(--muted);
  margin-bottom: 18px; font-weight: 600;
  display: flex; align-items: center; gap: 9px;
}
.form-group-title .gt-num {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--warm); color: var(--subtle);
  font-size: 11px; letter-spacing: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-hair);
  font-family: var(--font-body);
}

/* ===== 写卡页页头插图 ===== */
.write-illus {
  width: 200px; height: 130px; flex-shrink: 0;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-rest);
  border: 1px solid var(--line-hair);
}
.write-illus .illus {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 46%;
  display: block;
}

/* ===== 首页 Hero：档案馆入口 ===== */
.hero { padding: 44px 0 24px; position: relative; }
.hero-top {
  display: flex; align-items: flex-end; gap: 24px;
  margin-bottom: 20px;
}
.hero-figure {
  width: 136px; height: 136px;
  flex-shrink: 0;
  animation: riseIn var(--dur-slow) var(--ease-elastic) both 160ms;
}
.hero-words { flex: 1; min-width: 0; }
.hero-stamp {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; letter-spacing: 2.5px; color: var(--subtle);
  padding: 5px 14px; margin-bottom: 14px;
  border: 1px dashed var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.6);
}
.hero-stamp .stamp-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--seal); opacity: 0.7;
  animation: breathe 3.4s ease-in-out infinite;
}
.hero h1 {
  font-family: var(--font-hand);
  font-size: 36px; line-height: 1.35; letter-spacing: 0.5px;
  margin-bottom: 14px; color: var(--ink-strong);
  font-weight: 700;
}
.hero h1 .h1-sub {
  display: block; font-size: 16.5px; color: var(--muted);
  font-weight: 400; margin-top: 9px; letter-spacing: 3.5px;
}
.hero .hero-sub {
  color: var(--subtle); font-size: 15.5px; line-height: 2;
  max-width: 660px; margin-left: auto; margin-right: auto;
}
.hero-actions {
  display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px;
  align-items: center; justify-content: center;
}
.hero-actions .action-note { font-size: 12.5px; color: var(--muted); }

/* ===== 双向理念条：两封并排的信 ===== */
.philosophy-banner {
  position: relative;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px;
  align-items: center; margin: 24px auto 0;
  padding: 26px 26px 30px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  max-width: 660px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
  isolation: isolate;
  background-color: var(--paper);
  background-image: var(--illus-letters);
  background-size: cover;
  background-position: center 46%;
}
/* 插图之上的纸色遮罩：把水彩压成极淡的底纹，保证文字可读 */
.philosophy-banner::before {
  content: "";
  position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(100deg, rgba(237, 243, 255, 0.62) 0%, rgba(255, 253, 247, 0.93) 50%, rgba(236, 246, 239, 0.62) 100%),
    rgba(255, 253, 247, 0.87);
}
/* 两条并行的路：底部一蓝一绿，等宽等重 */
.philosophy-banner::after {
  content: "";
  position: absolute; left: 26px; right: 26px; bottom: 13px; height: 2.5px;
  background: linear-gradient(90deg,
    var(--brand) 0%, var(--brand) 42%,
    transparent 42%, transparent 58%,
    var(--stay-color) 58%, var(--stay-color) 100%);
  opacity: 0.42;
  border-radius: 999px;
}
.philosophy-banner .ph-side { font-size: 14px; line-height: 1.8; color: var(--subtle); }
.philosophy-banner .ph-side.left { text-align: right; }
.philosophy-banner .ph-side strong {
  display: block; font-size: 16px; margin-bottom: 5px;
  font-family: var(--font-hand); letter-spacing: 0.6px;
}
.philosophy-banner .ph-side.left strong { color: var(--brand); }
.philosophy-banner .ph-side.right strong { color: var(--stay-color); }
.philosophy-banner .ph-mid {
  font-size: 12px; color: var(--subtle); white-space: nowrap;
  padding: 7px 13px; letter-spacing: 2.5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px dashed var(--line);
  box-shadow: var(--shadow-rest);
}
.philosophy-conclusion {
  margin: 16px auto 0; font-size: 15.5px; line-height: 2;
  color: var(--ink); font-weight: 600; max-width: 660px;
  font-family: var(--font-hand);
  padding-left: 15px;
  border-left: 2.5px solid var(--line);
}

/* ===== 本周命题：一张便签 ===== */
.prompt-box {
  position: relative;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.72), transparent 52%),
    var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 26px 26px 24px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
  transition: box-shadow var(--dur-base) var(--ease-soft), transform var(--dur-base) var(--ease-soft);
}
.prompt-box:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.prompt-box::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--brand), var(--stay-color));
  opacity: 0.7;
}
.prompt-box::after {
  content: "";
  position: absolute; top: -34px; right: -24px;
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(207, 230, 238, 0.5), transparent 68%);
  pointer-events: none;
}
.prompt-box .label {
  position: relative;
  font-size: 11.5px; letter-spacing: 3.5px; color: var(--brand);
  margin-bottom: 12px; font-weight: 600;
}
.prompt-box .question {
  position: relative;
  font-family: var(--font-hand);
  font-size: 22px; line-height: 1.7; font-weight: 700;
  margin-bottom: 9px; color: var(--ink-strong);
}

/* ===== 区块标题 ===== */
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 46px 0 18px;
}
.section-title h2 {
  position: relative;
  font-family: var(--font-hand);
  font-size: 20px; letter-spacing: 1.2px; color: var(--ink-strong); font-weight: 700;
  padding-left: 15px;
}
.section-title h2::before {
  content: "";
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 17px; border-radius: 999px;
  background: linear-gradient(180deg, var(--brand), var(--stay-color));
  opacity: 0.65;
}

/* ===== 样本卡：档案卡 ===== */
.sample-cards { display: grid; gap: 20px; }

.sample-card {
  position: relative; display: block;
  background:
    linear-gradient(158deg, rgba(255, 255, 255, 0.66), transparent 44%),
    var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 24px 24px 20px 30px;
  cursor: pointer;
  overflow: hidden;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  transition: transform var(--dur-base) var(--ease-soft),
              box-shadow var(--dur-base) var(--ease-soft),
              border-color var(--dur-base) ease;
  animation: riseIn var(--dur-base) var(--ease-soft) both;
}
/* 装订边：色条 + 打孔 */
.sample-card::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: linear-gradient(180deg, var(--brand), rgba(0, 102, 255, 0.3));
  opacity: 0.8;
  transition: width var(--dur-base) var(--ease-soft);
}
.sample-card::after {
  content: "";
  position: absolute; left: 14px; top: 26px; bottom: 26px;
  width: 4px;
  background-image: radial-gradient(circle, rgba(122, 105, 76, 0.2) 0 1.8px, transparent 2px);
  background-size: 4px 30px;
  background-repeat: repeat-y;
  opacity: 0.55;
  pointer-events: none;
}
.sample-card:hover {
  transform: translateY(-5px);
  border-color: rgba(122, 105, 76, 0.22);
  box-shadow: var(--shadow-lift);
}
.sample-card:hover::before { width: 8px; }
.sample-card.stay-card::before {
  background: linear-gradient(180deg, var(--stay-color), rgba(45, 122, 79, 0.3));
}

/* 档案编号：打字机风格贴纸 */
.sample-index {
  position: absolute; top: 21px; right: 22px;
  font-size: 10.5px; letter-spacing: 1.6px;
  color: var(--subtle);
  font-family: var(--font-mono);
  padding: 3.5px 10px;
  border: 1px dashed rgba(122, 105, 76, 0.24);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.65);
  transform: rotate(1.2deg);
}
.sample-card h3 {
  font-family: var(--font-hand);
  font-size: 19.5px; line-height: 1.62; margin-bottom: 16px;
  padding-right: 104px; color: var(--ink-strong); font-weight: 700;
}

/* 路径对照：两条分岔的路 */
.path-compare {
  display: grid; gap: 0; margin-bottom: 16px;
  position: relative;
  padding-left: 17px;
}
/* 左侧分岔线 */
.path-compare::before {
  content: "";
  position: absolute; left: 3px; top: 13px; bottom: 13px; width: 1.5px;
  background: linear-gradient(180deg, var(--line), var(--line-soft));
  border-radius: 999px;
}
.path-row {
  position: relative;
  display: flex; gap: 11px; font-size: 14.5px; line-height: 1.8;
  padding: 9px 0;
}
.path-row + .path-row { border-top: 1px dashed var(--line-hair); }
/* 路口的节点 */
.path-row::before {
  content: "";
  position: absolute; left: -18px; top: 18px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--paper);
  border: 1.5px solid var(--line);
}
.path-row.divergent::before { border-color: var(--brand); background: var(--brand-soft); }
.path-row.stay::before { border-color: var(--stay-color); background: var(--stay-soft); }
.path-key {
  flex: 0 0 auto; font-size: 12px; padding: 2.5px 11px; border-radius: 999px;
  height: 24px; line-height: 18px;
  border: 1px solid var(--line-hair);
  color: var(--muted); background: rgba(255, 255, 255, 0.82); white-space: nowrap;
}
.path-row.divergent .path-key {
  border-color: rgba(0, 102, 255, 0.26); color: var(--brand); background: var(--brand-soft);
}
.path-row.stay .path-key {
  border-color: rgba(45, 122, 79, 0.26); color: var(--stay-color); background: var(--stay-soft);
}
.path-text { flex: 1; min-width: 0; color: var(--ink); }
.path-row .path-text.muted { color: var(--muted); }

/* 金句：手写便签 */
.highlight-quote {
  position: relative;
  margin: 0 0 16px; padding: 14px 18px 14px 38px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.5), transparent 50%),
    var(--warm);
  border-radius: 12px;
  font-family: var(--font-hand);
  font-size: 15px; line-height: 1.9; color: #564e40;
  box-shadow: inset 0 0 0 1px rgba(120, 100, 68, 0.05);
}
.highlight-quote::before {
  content: "\201C";
  position: absolute; left: 13px; top: 9px;
  font-size: 30px; line-height: 1;
  color: rgba(165, 76, 54, 0.3);
  font-family: Georgia, serif;
}
.card-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 18px; padding-top: 15px;
  border-top: 1px dashed var(--line-soft);
  font-size: 13.5px; color: var(--subtle);
}
.card-foot .foot-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-foot .unlocked-mark {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--seal);
  padding: 2px 9px; border-radius: 999px;
  background: var(--seal-soft);
  border: 1px solid rgba(165, 76, 54, 0.16);
}

/* ===== 详情页 ===== */
.back-link {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; color: var(--muted);
  padding: 7px 15px 7px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow-rest);
  transition: transform var(--dur-quick) var(--ease-soft),
              color var(--dur-quick) ease, background var(--dur-quick) ease;
}
.back-link:hover { color: var(--brand); transform: translateX(-3px); background: #fff; }

.detail-head { margin: 22px 0 26px; }
.detail-title {
  font-family: var(--font-hand);
  font-size: 28px; line-height: 1.5; margin: 18px 0 12px;
  color: var(--ink-strong); font-weight: 700;
}
.detail-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 13.5px; color: var(--muted);
}
.detail-meta .author-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 3px 12px 3px 4px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid var(--line-soft);
  color: var(--ink);
}
.detail-meta .author-chip .avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--warm), var(--sky));
  color: var(--subtle);
  font-size: 11px; font-family: var(--font-hand);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.9);
}
.detail-meta .stay-mark { color: var(--stay-color); font-weight: 600; }

/* 卡面内容块：一页页的档案纸 */
.detail-block {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: 20px 22px 20px 24px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-rest);
  transition: transform var(--dur-base) var(--ease-soft),
              box-shadow var(--dur-base) ease,
              border-color var(--dur-base) ease;
}
.detail-block::before {
  content: "";
  position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px;
  border-radius: 999px;
  background: var(--line);
  opacity: 0.6;
  transition: opacity var(--dur-base) ease;
}
.detail-block:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lift);
  border-color: rgba(122, 105, 76, 0.2);
}
.detail-block .block-label {
  display: flex; align-items: center; gap: 9px;
  font-size: 11.5px; letter-spacing: 2.5px; color: var(--muted);
  margin-bottom: 10px; font-weight: 600;
}
.detail-block .block-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line-hair), transparent);
}
.detail-block.accent {
  background: linear-gradient(140deg, var(--brand-soft), rgba(237, 243, 255, 0.36));
  border-color: rgba(0, 102, 255, 0.16);
}
.detail-block.accent::before { background: var(--brand); opacity: 0.75; }
.detail-block.accent .block-label { color: var(--brand); }
.detail-block.stay-accent {
  background: linear-gradient(140deg, var(--stay-soft), rgba(236, 246, 239, 0.36));
  border-color: rgba(45, 122, 79, 0.2);
}
.detail-block.stay-accent::before { background: var(--stay-color); opacity: 0.75; }
.detail-block.stay-accent .block-label { color: var(--stay-color); }
/* 「我当时最怕什么」：说明书说这一栏比结果重要 */
.detail-block.fear-block { background: linear-gradient(140deg, var(--seal-soft), rgba(253, 242, 237, 0.4)); border-color: rgba(165, 76, 54, 0.14); }
.detail-block.fear-block::before { background: var(--seal); opacity: 0.6; }
.detail-block.fear-block .block-label { color: var(--seal); }
.detail-block p { font-size: 15.5px; line-height: 2; white-space: pre-wrap; color: var(--ink); }

.exchange-with {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13.5px; color: var(--muted); line-height: 1.85;
  margin-top: 18px; padding: 13px 16px;
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.5);
}

/* 「后来怎样了」小节头：带封蜡的分界 */
.outcome-head {
  display: flex; align-items: center; gap: 13px;
  margin: 38px 0 16px;
}
.outcome-head h2 {
  font-family: var(--font-hand);
  font-size: 20px; letter-spacing: 1px; color: var(--ink-strong); font-weight: 700;
  flex-shrink: 0;
}
.outcome-head .head-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line), transparent);
}

/* ===== 交换引导卡：档案袋封面 ===== */
.exchange-intro {
  position: relative;
  background:
    linear-gradient(158deg, rgba(255, 255, 255, 0.7), transparent 46%),
    var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
  animation: riseIn var(--dur-base) var(--ease-soft) both;
}
/* 顶部插图：读到一半睡着了 */
.intro-illus {
  position: relative;
  height: 158px;
  overflow: hidden;
  border-bottom: 1px solid var(--line-hair);
  background: var(--warm);
}
.intro-illus .illus { object-position: center 52%; }
/* 插图与卡片衔接的柔光 */
.intro-illus::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255, 253, 247, 0.1) 0%, transparent 40%, rgba(255, 253, 247, 0.92) 100%);
  pointer-events: none;
}
/* 火漆印：压在插图右下角 */
.intro-illus .wax-seal {
  position: absolute; right: 22px; bottom: 14px; z-index: 2;
  width: 62px; height: 62px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand);
  font-size: 13px; line-height: 1.25; text-align: center; letter-spacing: 1px;
  color: #fdf0ea;
  background:
    radial-gradient(circle at 34% 28%, #c06148, var(--seal) 52%, var(--seal-deep) 100%);
  box-shadow:
    0 4px 12px rgba(139, 60, 41, 0.34),
    inset 0 -2px 6px rgba(90, 36, 24, 0.45),
    inset 0 2px 5px rgba(255, 255, 255, 0.25);
  transform: rotate(-9deg);
  animation: sealPress var(--dur-slow) var(--ease-elastic) both 260ms;
}
.intro-illus .wax-seal::before {
  content: "";
  position: absolute; inset: 5px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 240, 232, 0.42);
}

.exchange-intro .intro-body { padding: 24px 26px 26px; position: relative; }
.exchange-intro::after {
  content: "";
  position: absolute; top: 120px; right: -40px;
  width: 170px; height: 170px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 217, 168, 0.22), transparent 66%);
  pointer-events: none;
}
.intro-head {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 15px; position: relative;
}
.intro-head .lks { width: 72px; height: 72px; flex-shrink: 0; margin-top: -2px; }
.intro-head-words { flex: 1; min-width: 0; }
.exchange-intro .intro-eyebrow {
  font-size: 11.5px; letter-spacing: 3.5px; color: var(--brand);
  margin-bottom: 10px; font-weight: 600;
}
.exchange-intro h3 {
  font-family: var(--font-hand);
  font-size: 21px; line-height: 1.6; margin-bottom: 0; color: var(--ink-strong); font-weight: 700;
}
.exchange-intro .intro-why {
  position: relative;
  font-size: 15px; line-height: 2; color: var(--ink);
  padding: 16px 18px 16px 20px;
  background: var(--warm);
  border-radius: 12px; margin: 18px 0 20px;
}
.exchange-intro .intro-why::before {
  content: "";
  position: absolute; left: 0; top: 14px; bottom: 14px; width: 2.5px;
  border-radius: 999px; background: rgba(165, 76, 54, 0.3);
}
.intro-gains { margin-bottom: 22px; position: relative; }
.intro-gains .gain-title {
  font-size: 13px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.5px;
}
.intro-gains ul { list-style: none; display: grid; gap: 11px; }
.intro-gains li {
  display: flex; align-items: flex-start; gap: 11px;
  font-size: 14.5px; line-height: 1.8; color: var(--ink);
}
.intro-gains li .gain-icon {
  flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  font-size: 11px; display: flex; align-items: center; justify-content: center;
  margin-top: 4px; font-weight: 700;
  border: 1px solid rgba(0, 102, 255, 0.16);
}
.intro-privacy {
  position: relative;
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 12.5px; color: var(--muted); line-height: 1.9;
  padding-top: 16px; border-top: 1px dashed var(--line-soft);
}
.intro-privacy .privacy-icon {
  flex-shrink: 0; margin-top: 4px;
  width: 13px; height: 13px; border-radius: 3px;
  border: 1.5px solid var(--line);
  position: relative;
}
.intro-privacy .privacy-icon::before {
  content: "";
  position: absolute; left: 2.5px; top: -4px;
  width: 6px; height: 5px;
  border: 1.5px solid var(--line);
  border-bottom: none;
  border-radius: 3px 3px 0 0;
}

/* ===== 结果基调徽章 ===== */
.tone-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
  background: var(--stay-soft); color: var(--stay-color);
  border: 1px solid rgba(45, 122, 79, 0.18);
  font-weight: 500;
}
.tone-badge::before {
  content: "";
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; opacity: 0.6;
}
.tone-badge.tone-ok {
  background: var(--stay-soft); color: var(--stay-color);
  border-color: rgba(45, 122, 79, 0.18);
}
.tone-badge.tone-road {
  background: #fdf4e8; color: #97662c;
  border-color: rgba(151, 102, 44, 0.2);
}

/* ===== 分步问答：一次只写一题 ===== */
.step-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 18px;
}
.step-counter {
  font-size: 13px; color: var(--muted); letter-spacing: 0.6px;
  font-variant-numeric: tabular-nums;
}
.step-dots { display: flex; gap: 8px; align-items: center; }
.step-dot {
  position: relative;
  width: 28px; height: 5px; border-radius: 999px;
  background: rgba(122, 105, 76, 0.15);
  overflow: hidden;
  transition: background var(--dur-base) ease, width var(--dur-base) var(--ease-soft);
}
/* 已答完：像墨水填满 */
.step-dot.done::after, .step-dot.stay-done::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: 999px;
  transform-origin: left;
  animation: inkFill var(--dur-base) var(--ease-soft) both;
}
.step-dot.done::after { background: var(--brand); }
.step-dot.stay-done::after { background: var(--stay-color); }
.step-dot.current { background: rgba(0, 102, 255, 0.42); width: 36px; }
.step-dot.stay-current { background: rgba(45, 122, 79, 0.42); width: 36px; }

.qa-single {
  position: relative;
  background:
    linear-gradient(158deg, rgba(255, 255, 255, 0.74), transparent 44%),
    var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 28px 26px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  animation: riseIn var(--dur-base) var(--ease-soft) both;
  overflow: hidden;
}
.qa-single::before {
  content: "";
  position: absolute; left: 0; top: 24px; bottom: 24px; width: 3px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--brand), rgba(0, 102, 255, 0.18));
  opacity: 0.65;
}
.qa-single.stay::before {
  background: linear-gradient(180deg, var(--stay-color), rgba(45, 122, 79, 0.18));
}
/* 右上角「正在写」的水彩：极淡 */
.qa-single::after {
  content: "";
  position: absolute; top: -18px; right: -18px;
  width: 132px; height: 132px;
  border-radius: 50%;
  background-image: var(--illus-writing);
  background-size: cover;
  background-position: center 40%;
  opacity: 0.14;
  filter: saturate(0.85);
  pointer-events: none;
}
.qa-single > * { position: relative; z-index: 1; }
.qa-single .qa-question {
  font-family: var(--font-hand);
  font-size: 20.5px; line-height: 1.72; font-weight: 700;
  margin-bottom: 10px; color: var(--ink-strong);
  padding-right: 74px;
}
.qa-single .qa-sub {
  font-size: 13px; color: var(--muted); line-height: 1.85; margin-bottom: 18px;
}
.qa-single textarea {
  width: 100%; padding: 15px 16px;
  border: 1px solid var(--line); border-radius: 12px;
  font-family: inherit; font-size: 15.5px;
  line-height: 31px; resize: vertical;
  color: var(--text);
  min-height: 130px;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255, 255, 255, 0.96) 0 30px,
      rgba(120, 100, 68, 0.05) 30px 31px);
  transition: border-color var(--dur-quick) ease, box-shadow var(--dur-quick) ease;
}
.qa-single textarea::placeholder { color: #bbb1a0; }
.qa-single textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 4px var(--brand-mist);
}
.qa-single.stay textarea:focus {
  border-color: var(--stay-color);
  box-shadow: 0 0 0 4px var(--stay-mist);
}
.qa-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px;
}
.qa-skip-hint { font-size: 12.5px; color: var(--muted); }

/* 详情页里重看答案的小块 */
.qa-block { margin-bottom: 16px; }
.qa-block .qa-q { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.qa-block textarea {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14.5px; line-height: 1.8; resize: vertical;
  background: rgba(255, 255, 255, 0.92); color: var(--text);
}
.qa-block textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 4px var(--brand-mist);
}

/* ===== 镜像区：你刚刚写下的 ===== */
.mirror-box {
  position: relative;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.78), transparent 42%),
    linear-gradient(135deg, var(--paper) 0%, var(--paper-deep) 100%);
  border: 1px solid rgba(165, 76, 54, 0.16);
  border-radius: var(--radius-lg);
  padding: 28px 26px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
  animation: riseIn var(--dur-slow) var(--ease-soft) both;
}
.mirror-box::after {
  content: "";
  position: absolute; bottom: -56px; left: -34px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(247, 213, 216, 0.32), transparent 66%);
  pointer-events: none;
}
.mirror-box .mirror-label {
  position: relative;
  font-size: 11.5px; letter-spacing: 3.5px; color: var(--seal);
  margin-bottom: 14px; font-weight: 600;
}
.mirror-box .mirror-quote {
  position: relative;
  font-family: var(--font-hand);
  font-size: 18px; line-height: 2.05; color: var(--ink-strong);
  padding-left: 18px; border-left: 3px solid rgba(165, 76, 54, 0.42);
  white-space: pre-wrap;
}
.mirror-box .mirror-note {
  position: relative;
  font-size: 13px; color: var(--muted); line-height: 1.9; margin-top: 16px;
}

/* ===== 结局揭晓：被拆开的封存内容 ===== */
.outcome-reveal {
  position: relative;
  background:
    linear-gradient(158deg, rgba(255, 255, 255, 0.66), transparent 42%),
    var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 26px 26px 24px;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  animation: riseIn var(--dur-slow) var(--ease-soft) both;
  overflow: hidden;
}
/* 顶部一道「已拆封」的撕口 */
.outcome-reveal::before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 7px;
  background:
    repeating-linear-gradient(-45deg,
      rgba(165, 76, 54, 0.16) 0 7px,
      transparent 7px 14px);
}
.outcome-reveal .reveal-label {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; letter-spacing: 3px; color: var(--seal);
  font-weight: 600; margin-bottom: 14px;
}
.outcome-reveal .reveal-label::before {
  content: "";
  width: 15px; height: 15px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #c06148, var(--seal) 60%);
  box-shadow: inset 0 -1px 2px rgba(90, 36, 24, 0.4);
  opacity: 0.85;
}
.outcome-reveal .reveal-text {
  font-size: 15.5px; line-height: 2.05; white-space: pre-wrap; color: var(--ink);
}

/* 回访补充 */
.revisit-note {
  position: relative;
  margin-top: 14px; padding: 18px 20px 18px 22px;
  background: var(--seal-soft);
  border: 1px solid rgba(165, 76, 54, 0.14);
  border-radius: var(--radius-md);
  font-size: 14.5px; line-height: 1.95; color: var(--ink);
}
.revisit-note::before {
  content: "";
  position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px;
  border-radius: 999px; background: var(--seal); opacity: 0.55;
}
.revisit-note .rev-label {
  font-size: 12.5px; color: var(--seal); margin-bottom: 7px; letter-spacing: 0.5px;
}

/* ===== 安心结论条：两只茶碗 ===== */
.settle-note {
  position: relative;
  margin-top: 18px;
  border: 1px solid rgba(168, 141, 96, 0.2);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-rest);
  background: var(--warm);
}
.settle-illus {
  position: relative;
  height: 132px;
  overflow: hidden;
  background: var(--warm);
}
.settle-illus .illus { object-position: center 54%; }
.settle-illus::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 44%, rgba(247, 240, 226, 0.95) 100%);
  pointer-events: none;
}
.settle-words {
  padding: 18px 22px 22px;
  font-size: 14.5px; line-height: 2; color: var(--ink);
  text-align: center;
}
.settle-words strong {
  display: block;
  margin-top: 8px;
  color: var(--ink-strong);
  font-family: var(--font-hand); font-size: 16.5px; letter-spacing: 0.5px;
}
/* 结论下方：一蓝一绿两点，等重 */
.settle-words .settle-marks {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 14px;
}
.settle-words .settle-marks span {
  width: 28px; height: 3px; border-radius: 999px; opacity: 0.45;
}
.settle-words .settle-marks .m-brand { background: var(--brand); }
.settle-words .settle-marks .m-stay { background: var(--stay-color); }

/* ===== 刘看山回信：信纸 ===== */
.letter-head {
  display: flex; align-items: center; gap: 13px;
  margin: 34px 0 15px;
}
.letter-head h2 {
  font-size: 19px; font-family: var(--font-hand);
  letter-spacing: 0.6px; color: var(--ink-strong); font-weight: 700;
}
.letter-head .lks {
  width: 42px; height: 42px;
  border-radius: 50%;
  background-color: var(--seal-soft);
  background-position: center 64%;
  background-size: 150%;
  border: 1px solid rgba(165, 76, 54, 0.18);
}
.letter-head .head-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line), transparent);
}

.letter {
  position: relative;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.6), transparent 20%),
    repeating-linear-gradient(
      to bottom,
      var(--paper) 0px, var(--paper) 31px,
      rgba(122, 105, 76, 0.1) 31px, rgba(122, 105, 76, 0.1) 32px
    );
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 32px 30px 28px 34px;
  line-height: 32px;
  font-size: 16px;
  font-family: var(--font-hand);
  color: #453f37;
  white-space: pre-wrap;
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
  animation: riseIn var(--dur-slow) var(--ease-soft) both;
}
/* 信纸左侧红线 */
.letter::before {
  content: "";
  position: absolute;
  left: 17px; top: 0; bottom: 0;
  width: 1px;
  background: rgba(165, 76, 54, 0.18);
}
/* 右上角邮戳 */
.letter::after {
  content: "看 山";
  position: absolute;
  top: 18px; right: 20px;
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand);
  font-size: 13px; letter-spacing: 1px;
  color: rgba(165, 76, 54, 0.42);
  border: 1.5px solid rgba(165, 76, 54, 0.3);
  border-radius: 50%;
  transform: rotate(-11deg);
  opacity: 0.72;
  pointer-events: none;
}
.letter-sign {
  margin-top: 20px; text-align: right;
  color: var(--seal); font-size: 15.5px;
  font-family: var(--font-hand);
  letter-spacing: 0.6px;
}

/* 折叠：重看自己的回答 */
.recall-details { margin-top: 20px; }
.recall-details summary {
  cursor: pointer; color: var(--brand); font-size: 13.5px;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid var(--line-soft);
  list-style: none;
  transition: background var(--dur-quick) ease;
}
.recall-details summary::-webkit-details-marker { display: none; }
.recall-details summary:hover { background: var(--brand-soft); }
.recall-details[open] summary { margin-bottom: 12px; }

/* ===== 给卡主的话：封好待寄 ===== */
.msg-to-author {
  position: relative;
  margin-top: 26px;
  background:
    linear-gradient(158deg, rgba(255, 255, 255, 0.64), transparent 44%),
    var(--paper);
  border: 1px solid rgba(165, 76, 54, 0.14);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-rest), var(--shadow-inset-paper);
  overflow: hidden;
}
/* 顶部插图横条：已封好、还没寄出 */
.msg-illus {
  position: relative;
  height: 116px;
  overflow: hidden;
  background: var(--warm);
  border-bottom: 1px solid var(--line-hair);
}
.msg-illus .illus { object-position: center 56%; }
.msg-illus::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255, 253, 247, 0.06) 0%, transparent 36%, rgba(255, 253, 247, 0.9) 100%);
  pointer-events: none;
}
.msg-body { padding: 20px 24px 22px; }
.msg-to-author .msg-label {
  font-size: 11.5px; letter-spacing: 3.5px; color: var(--seal);
  margin-bottom: 12px; font-weight: 600;
}
.msg-to-author .msg-notice {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 12.5px; color: #8a7a5f; line-height: 1.9; margin-bottom: 16px;
  padding: 12px 15px;
  background: #fdf6ea; border-radius: 10px;
  border-left: 2.5px solid rgba(214, 176, 106, 0.7);
}
.msg-to-author .msg-notice .notice-pin { flex-shrink: 0; font-size: 13px; line-height: 1.6; }
.msg-to-author textarea {
  width: 100%; padding: 13px 15px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14.5px;
  line-height: 1.9; resize: vertical;
  background: rgba(255, 255, 255, 0.94); color: var(--text); min-height: 94px;
  transition: border-color var(--dur-quick) ease, box-shadow var(--dur-quick) ease;
}
.msg-to-author textarea::placeholder { color: #bbb1a0; }
.msg-to-author textarea:focus {
  outline: none; border-color: var(--seal);
  box-shadow: 0 0 0 4px rgba(165, 76, 54, 0.08);
}
.msg-saved-list { margin-bottom: 16px; display: grid; gap: 10px; }
.msg-saved-item {
  position: relative;
  padding: 14px 16px 14px 18px;
  background: var(--warm); border-radius: 12px;
  font-size: 13.5px; line-height: 1.9; color: var(--ink);
  animation: riseIn var(--dur-base) var(--ease-soft) both;
}
.msg-saved-item::before {
  content: "";
  position: absolute; left: 0; top: 13px; bottom: 13px; width: 2.5px;
  border-radius: 999px;
  background: rgba(165, 76, 54, 0.22);
}
.msg-saved-item.is-own::before { background: rgba(165, 76, 54, 0.58); }
.msg-saved-item .msg-meta {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted); margin-top: 8px;
}
.msg-saved-item .msg-meta .own-flag {
  padding: 1.5px 8px; border-radius: 999px;
  background: rgba(165, 76, 54, 0.1); color: var(--seal);
  font-size: 11px;
}

/* ===== AI 对话窗 ===== */
.ai-chat-panel {
  margin-top: 30px;
  border: 1px solid rgba(0, 102, 255, 0.14);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-rest);
  background: var(--surface);
}
.ai-chat-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: linear-gradient(120deg, var(--brand-soft), rgba(237, 243, 255, 0.4));
  border-bottom: 1px solid transparent;
  cursor: pointer;
  user-select: none;
  transition: background var(--dur-quick) ease;
}
.ai-chat-header:hover { background: linear-gradient(120deg, #e5edff, var(--brand-soft)); }
.ai-chat-header.open { border-bottom-color: rgba(0, 102, 255, 0.12); }
.ai-chat-header .ai-label {
  font-size: 14.5px; font-weight: 600; color: var(--brand);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-hand); letter-spacing: 0.5px;
}
.ai-chat-header .ai-label .lks {
  width: 33px; height: 33px;
  border-radius: 50%;
  background-color: rgba(255, 255, 255, 0.85);
  background-position: center 62%;
  background-size: 150%;
  border: 1px solid rgba(0, 102, 255, 0.14);
}
.ai-chat-header .ai-sub { font-size: 12px; color: var(--muted); font-weight: 400; }
.ai-chat-header .ai-toggle {
  font-size: 11px; color: var(--muted);
  transition: transform var(--dur-base) var(--ease-soft);
}
.ai-chat-header.open .ai-toggle { transform: rotate(180deg); }

.ai-chat-body { padding: 18px; background: var(--surface); }
.ai-messages {
  display: flex; flex-direction: column; gap: 12px;
  margin-bottom: 14px; max-height: 420px; overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}
.ai-messages::-webkit-scrollbar { width: 6px; }
.ai-messages::-webkit-scrollbar-thumb {
  background: var(--line); border-radius: 999px;
}
.ai-msg {
  padding: 12px 16px; border-radius: 16px;
  font-size: 14.5px; line-height: 1.95;
  max-width: 88%;
  white-space: pre-wrap;
  animation: riseIn var(--dur-base) var(--ease-soft) both;
}
.ai-msg.ai {
  background: var(--paper); border: 1px solid var(--line-soft);
  align-self: flex-start; border-bottom-left-radius: 6px;
  color: var(--ink);
}
.ai-msg.user {
  background: linear-gradient(135deg, var(--brand-soft), rgba(237, 243, 255, 0.62));
  border: 1px solid rgba(0, 102, 255, 0.14);
  align-self: flex-end; margin-left: auto; border-bottom-right-radius: 6px;
  color: var(--ink);
}
.ai-msg.loading {
  background: var(--paper); border: 1px solid var(--line-soft);
  color: var(--muted); align-self: flex-start;
  display: flex; align-items: center; gap: 9px;
  font-style: normal;
}
.ai-msg.loading .typing {
  display: inline-flex; gap: 4px; align-items: center;
}
.ai-msg.loading .typing i {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--brand); display: block;
  animation: dotWave 1.25s ease-in-out infinite;
}
.ai-msg.loading .typing i:nth-child(2) { animation-delay: 0.16s; }
.ai-msg.loading .typing i:nth-child(3) { animation-delay: 0.32s; }
.ai-input-row { display: flex; gap: 9px; align-items: flex-end; }
.ai-input-row textarea {
  flex: 1; padding: 12px 15px;
  border: 1px solid var(--line); border-radius: 14px;
  font-family: inherit; font-size: 14px; line-height: 1.8;
  resize: none; min-height: 46px; max-height: 120px;
  background: rgba(255, 255, 255, 0.94); color: var(--text);
  transition: border-color var(--dur-quick) ease, box-shadow var(--dur-quick) ease;
}
.ai-input-row textarea::placeholder { color: #bbb1a0; }
.ai-input-row textarea:focus {
  outline: none; border-color: var(--brand); background: #fff;
  box-shadow: 0 0 0 4px var(--brand-mist);
}
.ai-input-row button { flex-shrink: 0; }
.ai-context-note {
  font-size: 12px; color: var(--subtle); line-height: 1.85; margin-bottom: 14px;
  padding: 11px 15px; background: var(--brand-soft); border-radius: 10px;
  border-left: 2.5px solid rgba(0, 102, 255, 0.28);
}

/* ===== 封存态 / 空状态：档案袋 ===== */
.sealed {
  position: relative;
  border: 1px solid rgba(168, 141, 96, 0.28);
  border-radius: var(--radius-lg);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.55), transparent 58%),
    repeating-linear-gradient(45deg, #f9f3e6, #f9f3e6 11px, #f4ecda 11px, #f4ecda 22px);
  padding: 40px 28px 34px;
  text-align: center;
  color: #8c8271;
  box-shadow: var(--shadow-inset-paper), var(--shadow-rest);
  overflow: hidden;
}
/* 档案袋封口线 */
.sealed::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 36px;
  background: linear-gradient(180deg, rgba(168, 141, 96, 0.1), transparent);
  border-bottom: 1px dashed rgba(168, 141, 96, 0.3);
}
.sealed .sealed-illus {
  position: relative;
  width: 190px; height: 130px;
  margin: 8px auto 16px;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-rest);
  border: 1px solid rgba(255, 255, 255, 0.7);
}
.sealed .sealed-illus .illus { object-position: center 50%; }
.sealed .sealed-figure {
  width: 96px; height: 96px;
  margin: 6px auto 12px;
}
.sealed p { position: relative; font-size: 14.5px; line-height: 2; }

/* ===== 档案页 ===== */
.archive-head {
  display: flex; align-items: flex-start; gap: 20px;
  margin: 22px 0 8px; flex-wrap: wrap;
}
.archive-stats {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px;
}
.archive-stat {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow-rest);
}
.archive-stat .num {
  font-size: 21px; font-weight: 700; color: var(--ink-strong);
  font-variant-numeric: tabular-nums;
  font-family: var(--font-hand);
}
.archive-stat .lbl { font-size: 12.5px; color: var(--muted); }
.archive-stat.is-brand .num { color: var(--brand); }
.archive-stat.is-stay .num { color: var(--stay-color); }

.archive-tabs { display: flex; gap: 9px; margin: 28px 0 20px; flex-wrap: wrap; }

.archive-record {
  position: relative;
  background: var(--warm);
  border: 1px solid rgba(168, 141, 96, 0.2);
  border-radius: var(--radius-md);
  padding: 20px 22px; margin-top: 10px;
  font-size: 14px; line-height: 1.95;
}
.archive-record .rec-label {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.5px;
}
.archive-record .rec-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(168, 141, 96, 0.24), transparent);
}
.archive-record .rec-qa { margin-bottom: 12px; }
.archive-record .rec-qa .rec-q { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.archive-record .rec-qa .rec-a {
  color: var(--ink); padding-left: 12px;
  border-left: 2px solid rgba(168, 141, 96, 0.3);
}
.archive-record details summary {
  cursor: pointer; color: var(--brand); font-size: 13.5px; margin-top: 8px;
}

/* ===== 页脚 ===== */
.footer {
  position: relative; z-index: 1;
  max-width: 976px; margin: 0 auto; padding: 0 22px 52px;
  font-size: 12.5px; color: var(--muted); line-height: 2;
  display: flex; align-items: center; gap: 15px;
}
.footer .lks { width: 46px; height: 46px; flex-shrink: 0; opacity: 0.9; }
.footer .foot-rule {
  display: block; height: 1px; margin-bottom: 14px;
  background: linear-gradient(90deg, var(--line-soft), transparent);
}

.loading-text { color: var(--muted); padding: 20px 0; }

/* ===== 对话框 / 通知 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(74, 69, 60, 0.34);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  animation: riseIn var(--dur-quick) ease both;
}
.modal-box {
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-xl);
  padding: 30px 28px; max-width: 480px; width: 100%;
  box-shadow: var(--shadow-deep);
  animation: riseIn var(--dur-base) var(--ease-elastic) both;
}
.modal-box h2 { font-family: var(--font-hand); font-size: 20px; margin-bottom: 8px; color: var(--ink-strong); }
.modal-box p { font-size: 14px; color: var(--muted); margin-bottom: 18px; line-height: 1.85; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(68, 62, 53, 0.95);
  backdrop-filter: blur(10px);
  color: #fff8ec; border-radius: 999px;
  padding: 10px 22px 10px 12px;
  font-size: 14px; z-index: 200;
  max-width: calc(100vw - 40px);
  box-shadow: var(--shadow-deep);
  animation: toastIn var(--dur-base) var(--ease-elastic);
}
.toast::before {
  content: "";
  width: 27px; height: 27px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--toast-avatar, var(--sky)) center 62% / 150% no-repeat;
  background-color: rgba(255, 255, 255, 0.14);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.94); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

/* ===== 无障碍与响应式 ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* 平板 */
@media (max-width: 860px) {
  .hero h1 { font-size: 31px; }
  .philosophy-banner { max-width: 100%; }
}

/* 手机 */
@media (max-width: 640px) {
  .page { padding: 20px 16px 76px; }
  .header-inner { padding: 10px 16px; }
  .hero { padding: 28px 0 20px; }
  .hero-top { flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .hero-figure { width: 110px; height: 110px; }
  .hero-stamp { margin-bottom: 10px; }
  .hero h1 { font-size: 26px; }
  .hero h1 .h1-sub { font-size: 14.5px; letter-spacing: 2.5px; }
  .hero .hero-sub { text-align: left; font-size: 15px; }
  .hero-actions { justify-content: center; }
  .hero-actions .btn { flex: 1 1 auto; }

  .philosophy-banner {
    grid-template-columns: 1fr; text-align: center;
    padding: 22px 20px 24px; gap: 14px;
    background-image: none;
  }
  .philosophy-banner::after { display: none; }
  .philosophy-banner .ph-side.left { text-align: center; }
  .philosophy-banner .ph-mid { justify-self: center; }
  /* 移动端用两条等重的线代替背景插图 */
  .philosophy-banner .ph-side.left { padding-bottom: 14px; border-bottom: 2px solid rgba(0, 102, 255, 0.28); }
  .philosophy-banner .ph-side.right { padding-top: 14px; border-top: 2px solid rgba(45, 122, 79, 0.28); }
  .philosophy-conclusion { font-size: 15px; }

  .prompt-box { padding: 22px 20px; }
  .prompt-box .question { font-size: 19px; }

  .section-title { margin: 36px 0 14px; }
  .sample-card { padding: 20px 18px 18px 24px; }
  .sample-card h3 { font-size: 17.5px; padding-right: 0; }
  .sample-index { position: static; display: inline-block; margin-bottom: 12px; transform: none; }
  .sample-card::after { display: none; }
  .card-foot { flex-direction: column; align-items: stretch; gap: 12px; }
  .card-foot .btn { width: 100%; }

  .detail-title { font-size: 23px; }
  .detail-block { padding: 18px 18px 18px 20px; }
  .detail-block p { font-size: 15px; }

  .intro-illus { height: 118px; }
  .intro-illus .wax-seal { width: 52px; height: 52px; font-size: 11.5px; right: 16px; bottom: 10px; }
  .exchange-intro .intro-body { padding: 20px 18px 22px; }
  .intro-head { flex-direction: column; align-items: center; text-align: center; }
  .exchange-intro h3 { font-size: 19px; }

  .qa-single { padding: 22px 18px; }
  .qa-single .qa-question { font-size: 18.5px; padding-right: 0; }
  .qa-single::after { width: 96px; height: 96px; opacity: 0.1; }
  .qa-actions .btn { flex: 1 1 auto; }

  .mirror-box { padding: 22px 20px; }
  .mirror-box .mirror-quote { font-size: 16.5px; }

  .outcome-reveal { padding: 22px 20px; }
  .settle-illus { height: 104px; }
  .settle-words { padding: 16px 18px 20px; }

  .letter { padding: 26px 20px 22px 24px; font-size: 15.5px; }
  .letter::after { display: none; }

  .msg-illus { height: 92px; }
  .msg-body { padding: 18px 18px 20px; }

  .ai-msg { max-width: 94%; }
  .ai-chat-header { padding: 12px 15px; }
  .ai-chat-header .ai-sub { display: none; }
  .ai-chat-body { padding: 15px; }

  .sealed { padding: 32px 20px 28px; }
  .sealed .sealed-illus { width: 100%; max-width: 230px; height: 122px; }

  .archive-stat { padding: 9px 15px; }
  .archive-stat .num { font-size: 19px; }

  .form-sheet { padding: 24px 18px 22px; }
  .form-sheet::before { display: none; }
  .form-sheet .form-group { padding-left: 0; }

  .header-brand .sub { display: none; }
  .header-nav { gap: 14px; }
  .header-nav a:not(.nav-main):not(.nav-login) { display: none; }

  .sky-cloud.c2, .sky-cloud.c3 { display: none; }
  .footer { padding: 0 16px 44px; }
}

/* 超窄屏 */
@media (max-width: 380px) {
  .hero h1 { font-size: 23.5px; }
  .prompt-box .question { font-size: 17.5px; }
  .qa-single .qa-question { font-size: 17px; }
}

/* 打印：把卡片当档案打印出来 */
@media print {
  .sky-layer, .header, .footer, .toast, .ai-chat-panel, .msg-to-author { display: none !important; }
  body { background: #fff; }
  body::after { display: none; }
  .page { padding: 0; }
  .card, .detail-block, .letter, .sample-card { box-shadow: none; break-inside: avoid; }
}

    return m ? m[1] : '';
  } catch (e) { return ''; }
}

function esc(str) {
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max) + '…' : str;
}
function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysAgo(n) {

    localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(STATE.localMessages || []));
  } catch(e) { /* quota 超限时静默 */ }
}
function loadLocal() {
  try {
    const c = localStorage.getItem(STORAGE_KEYS.cards);
    const r = localStorage.getItem(STORAGE_KEYS.records);
    if (c) STATE.localCards = JSON.parse(c);
    if (r) STATE.localRecords = JSON.parse(r);
    const m = localStorage.getItem(STORAGE_KEYS.messages);
    if (m) STATE.localMessages = JSON.parse(m);
    let gid = localStorage.getItem(STORAGE_KEYS.guestId);
    let gname = localStorage.getItem(STORAGE_KEYS.guestName);
    if (!gid) {
      gid = 'guest-' + randomId().slice(0,6);

// ===== 获取所有卡（种子 + 本地）=====
function getAllCards() {
  const seedIds = new Set(SEED_CARDS.map(c => c.id));
  const userCards = STATE.localCards.filter(c => !seedIds.has(c.id));
  return [...userCards, ...SEED_CARDS];
}
function getCardById(id) { return getAllCards().find(c => c.id === id) || null; }
function hasUnlocked(cardId) {
  const identity = getIdentity();
  return STATE.localRecords.some(r => r.cardId === cardId && r.userId === identity.id);
}
function getRecord(cardId) {
  const identity = getIdentity();
  return STATE.localRecords.find(r => r.cardId === cardId && r.userId === identity.id) || null;
}
function getRealExchangeCount(card) {
  const extra = STATE.localRecords.filter(r => r.cardId === card.id).length;
  return (card.exchangeCount || 0) + extra;
}

// ===== 视图切换 =====
function showView(name, cardId) {
  ['home','detail','write','archive'].forEach(v => {
    $(('view-'+v)).style.display = (v === name) ? '' : 'none';
  });
  STATE.currentView = name;
  if (name === 'home')    renderHome();
  if (name === 'detail')  { STATE.currentCardId = cardId; renderDetail(cardId); }
  if (name === 'write')   renderWrite();
  if (name === 'archive') renderArchive();
  window.scrollTo({ top: 0, behavior: 'smooth' });

function getZhihuUser() {

// 页面加载时：若已用知乎登录，把身份写入 localStorage（供 loadLocal 读取绑定）

function startExchange(cardId) {

/** 暂存当前题答案（不校验，允许空着切来切去） */
function cacheCurrentAnswer(card, idx) {
  const q = card.exchangeQuestions[idx];
  const ta = $("ans-" + q.id);
  if (!STATE.answers) STATE.answers = {};
  if (ta) STATE.answers[q.id] = ta.value;
}

function nextStep(cardId, idx) {
  const card = getCardById(cardId);
  if (!card) return;
  const q = card.exchangeQuestions[idx];
  const ta = $("ans-" + q.id);
  const val = ta ? ta.value.trim() : "";
  const errEl = $("exchange-error");
  if (val.length < 4) {
    if (errEl) errEl.innerHTML = '<div class="error-box">这一题还需要你写下自己的答案（至少 4 个字）。写「还没想好」也可以。</div>';
    return;
  }
  cacheCurrentAnswer(card, idx);
  const oz = $("outcome-zone");
  if (oz) oz.innerHTML = renderAnsweringZone(card, idx + 1);
  const h2 = document.querySelector("#outcome-zone");
  if (h2) h2.scrollIntoView({ behavior: "smooth", block: "start" });
}

function prevStep(cardId, idx) {
  const card = getCardById(cardId);
  if (!card) return;
  cacheCurrentAnswer(card, idx);
  const oz = $("outcome-zone");
  if (oz) oz.innerHTML = renderAnsweringZone(card, idx - 1);
}

async function submitExchange(cardId) {
  const card = getCardById(cardId);
  if (!card) return;
  const btn = $('submit-exchange-btn');
  const errEl = $('exchange-error');
  if (errEl) errEl.innerHTML = '';

  const answers = [];
  for (let i = 0; i < card.exchangeQuestions.length; i++) {
    const q = card.exchangeQuestions[i];
    // 当前题从输入框取，之前的题从暂存取
    const ta = $("ans-" + q.id);
    let val = ta ? ta.value.trim() : ((STATE.answers && STATE.answers[q.id]) || "").trim();
    if (val.length < 4) {
      if (errEl) errEl.innerHTML = '<div class="error-box">「' + esc(q.question) + '」还需要你写下自己的答案（至少 4 个字）。</div>';
      if (btn) { btn.disabled = false; btn.textContent = "看他后来怎样了"; }
      return;
    }
    answers.push({ questionId: q.id, question: q.question, answer: val });
  }

  if (btn) { btn.disabled = true; btn.textContent = '刘看山正在读你的回答…'; }

  const identity = getIdentity();
  let reply = '';
  let replyFromAi = false;

  try {
    const res = await fetch('/api/exchange/cards/' + cardId + '/exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers })
    });
    const body = await res.json();
    if (body.ok) {
      reply = body.data.liuKanshanReply || '';
      replyFromAi = body.data.record?.replyFromAi || false;
    }
  } catch {}

  // 无论 API 是否可用，都保存本地记录并生成兜底回信
  if (!reply) {
    reply = buildFallbackReply(card, answers);
  }

  const record = {
    id: 'ex-' + randomId(),
    cardId: card.id,
    userId: identity.id,
    userName: identity.name,
    answers,
    liuKanshanReply: reply,
    replyFromAi,
    createdAt: new Date().toISOString()
  };
  // 去重
  STATE.localRecords = STATE.localRecords.filter(r => !(r.cardId === cardId && r.userId === identity.id));
  STATE.localRecords.push(record);
  saveLocal();

  const oz = $('outcome-zone');
  if (oz) oz.innerHTML = renderUnlockedZone(card, record);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('解锁成功！刘看山读了你的回答。');
}

function buildFallbackReply(card, answers) {
  const isStay = card.type === 'stay';
  const first = answers.find(a => a.answer.trim().length > 0);
  const quoted = first ? first.answer.trim().slice(0, 50) : '';
  const p1 = isStay
    ? `你刚刚读完的，是「${card.authorName}」选择守住初心的故事。他当时最怕的是：${card.fear.slice(0,40)}。`
    : `你刚刚读完的，是「${card.authorName}」写下的一次选择。他当时最怕的是：${card.fear.slice(0,40)}。`;
  const p2 = quoted
    ? `而你写下的是「${quoted}」。我把它留在这里了——你不必现在就为它做什么决定。`
    : `你愿意在这里停下来回答几个问题，这件事本身就已经发生了。`;
  const p3 = isStay
    ? `坚守和越轨都需要勇气。他选择留下，不是因为惰性，而是因为那是他真正想要的。这个交换所里没有哪种选择更高级，只有「是不是真的自己的」。`
    : `这个交换所里没有一张卡是干净的结局。有人算不过来账，有人至今说不清意义。你读到的这个人也害怕过，这不影响他后来真的做了。`;
  return [p1, p2, p3].join('\n\n');
}

function setWriteType(val) {
  writeState.type = val;
  renderWrite();
}
function setWriteStatus(val) {
  writeState.status = val;
  document.querySelectorAll('#status-btns button').forEach((b, i) => {
    b.className = 'btn ' + (STATUS_OPTIONS[i].value === val ? '' : 'btn-quiet') + ' btn-sm';
    b.style.cssText = 'border-radius:999px;padding:7px 16px;font-size:13.5px;';
  });
  writeState.status = val;
}
function toggleTag(tag) {
  if (writeState.tags.includes(tag)) {
    writeState.tags = writeState.tags.filter(t => t !== tag);
  } else if (writeState.tags.length < 6) {
    writeState.tags.push(tag);
  } else {
    toast('最多 6 个标签。');
    return;
  }
  renderWrite();
}
function addCustomTag() {
  let val = (writeState.customTag || ($('custom-tag') ? $('custom-tag').value : '')).trim();
  if (!val) return;
  if (!val.startsWith('#')) val = '#' + val;
  if (!writeState.tags.includes(val)) {
    if (writeState.tags.length >= 6) { toast('最多 6 个标签。'); return; }
    writeState.tags.push(val);
  }
  writeState.customTag = '';
  renderWrite();
}

async function suggestQuestions() {
  const btn = $('suggest-btn');
  const note = $('suggest-note');
  if (btn) { btn.disabled = true; btn.textContent = '刘看山正在想…'; }
  writeState.suggesting = true;
  try {
    const res = await fetch('/api/exchange/questions/suggest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: writeState.title, defaultPath: writeState.defaultPath,
        divergence: writeState.divergence, fear: writeState.fear
      })
    });
    const body = await res.json();
    if (body.ok) {
      writeState.questions = [...body.data.questions, '', ''].slice(0, 3);
      if (note) note.textContent = body.data.fromAi
        ? '这是刘看山的建议，你可以随意改写或全部删掉。'
        : 'AI 暂时不可用，给了几个通用问题，建议你改成自己的话。';
    }
  } catch {
    if (note) note.textContent = '建议生成失败，你可以自己写。';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '让刘看山帮我想几个'; }
    // 更新输入框
    writeState.questions.forEach((q, i) => {
      const inp = $('q-' + i);
      if (inp) inp.value = q;
    });
  }
}

async function submitCard() {
  // 先同步最新输入框值
  ['title','defaultPath','divergence','trigger','fear','outcome','highlight'].forEach(f => {
    const el = $('w-' + (f === 'highlight' ? 'highlight' : f === 'defaultPath' ? 'defaultPath' : f === 'wantToExchangeWith' ? 'with' : f));
    if (el) writeState[f] = el.value.trim();
  });
  const withEl = $('w-with');
  if (withEl) writeState.wantToExchangeWith = withEl.value.trim();
  writeState.questions = [0,1,2].map(i => { const el = $('q-'+i); return el ? el.value.trim() : writeState.questions[i] || ''; });

  const errEl = $('write-error');
  if (errEl) errEl.innerHTML = '';
  const btn = $('write-submit-btn');

  const required = [
    ['title','给这张卡起一个标题'],
    ['defaultPath','我的默认答案'],
    ['divergence', writeState.type==='stay' ? '我守住的选择' : '我的越轨选择'],
    ['trigger','触发瞬间'],['fear','我当时最怕什么'],['outcome','后来怎样了']
  ];
  for (const [key, label] of required) {
    if (!writeState[key] || !writeState[key].trim()) {
      if (errEl) errEl.innerHTML = `<div class="error-box">请填写「${label}」。</div>`;
      return;
    }
  }
  const validQs = writeState.questions.filter(q => q.trim());
  if (validQs.length < 2) {
    if (errEl) errEl.innerHTML = `<div class="error-box">请至少留下 2 个想问对方的问题。</div>`;
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '正在收进交换所…'; }

  // 先尝试调 API
  let saved = false;
  try {
    const res = await fetch('/api/exchange/cards', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: writeState.title, defaultPath: writeState.defaultPath,
        divergence: writeState.divergence, trigger: writeState.trigger,
        fear: writeState.fear, outcome: writeState.outcome,
        highlight: writeState.highlight, wantToExchangeWith: writeState.wantToExchangeWith,
        status: writeState.status, tags: writeState.tags,
        exchangeQuestions: validQs, type: writeState.type
      })
    });
    const body = await res.json();
    if (body.ok) saved = true;
  } catch {}

  // API 不可用时本地保存（GitHub Pages 情况）
  if (!saved) {
    const identity = getIdentity();
    const now = new Date().toISOString();
    const card = {
      id: 'card-' + randomId(),
      authorId: identity.id, authorName: identity.name, authorAvatar: '',
      type: writeState.type, title: writeState.title.trim(),
      defaultPath: writeState.defaultPath.trim(), divergence: writeState.divergence.trim(),
      trigger: writeState.trigger.trim(), fear: writeState.fear.trim(),
      outcome: writeState.outcome.trim(), outcomeHidden: true,
      highlight: writeState.highlight.trim() || writeState.trigger.trim().slice(0,60),
      wantToExchangeWith: writeState.wantToExchangeWith.trim(),
      status: writeState.status,
      tags: writeState.tags.map(t => t.startsWith('#') ? t : '#' + t).slice(0,6),
      exchangeQuestions: validQs.slice(0,3).map((q,i) => ({ id:'q'+(i+1), question:q })),
      createdAt: now, updatedAt: now, revisitAt: null, revisitNote: null, exchangeCount: 0
    };
    STATE.localCards.unshift(card);
    saveLocal();
  }

  // 重置写卡状态
  writeState = { type:'diverge', title:'', defaultPath:'', divergence:'', trigger:'', fear:'', outcome:'', highlight:'', wantToExchangeWith:'', status:'ongoing', tags:[], questions:['','',''], suggesting:false, submitting:false, customTag:'' };
  toast('你的选择卡已放进交换所 ✓');
  showView('archive');
}

function switchArchiveTab(tab) {

  const records = STATE.localRecords.filter(r => r.userId === identity.id);
  const exchangedCards = records.map(r => ({ card: getCardById(r.cardId), record: r })).filter(x => x.card);

  $('tab-mine').className = 'chip' + (tab === 'mine' ? ' is-on' : '');
  $('tab-exchanged').className = 'chip' + (tab === 'exchanged' ? ' is-on' : '');
  $('archive-content').innerHTML = renderArchiveTab(tab, myCards, exchangedCards, identity);

    <div class="rec-qa">

  }
