// ===== 给卡主的话（留言）=====

/** 删除我自己写的卡（仅限本人，带二次确认） */
function deleteMyCard(cardId) {
  const card = getCardById(cardId);
  if (!card) return;
  const identity = getIdentity();
  // 安全校验：只能删自己的卡，种子卡不可删
  if (card.authorId !== identity.id) { toast('只能删除你自己写的卡。'); return; }
  const isSeed = SEED_CARDS.some(c => c.id === cardId);
  if (isSeed) { toast('示例样本卡不可删除。'); return; }

  if (!confirm('确定要删掉这张卡吗？\n\n删除后，别人将不能再读到它，你留下的这段记录也会消失。这个操作无法撤销。')) return;

  STATE.localCards = STATE.localCards.filter(c => c.id !== cardId);
  // 一并清掉与这张卡相关的交换记录和留言，避免留下孤儿数据
  STATE.localRecords = STATE.localRecords.filter(r => r.cardId !== cardId);
  STATE.localMessages = (STATE.localMessages || []).filter(m => m.cardId !== cardId);
  saveLocal();
  toast('已删除。你随时可以重新写一张。');
  renderArchive();
}

/** 删除我自己留下的一条留言 */
function deleteMyMessage(msgId, cardId) {
  if (!confirm('删掉这句话吗？')) return;
  STATE.localMessages = (STATE.localMessages || []).filter(m => m.id !== msgId);
  saveLocal();
  toast('已删除');
  const zone = document.getElementById('msg-zone-' + cardId);
  if (zone) zone.outerHTML = renderMsgToAuthor(cardId);
}

function getMsgsForCard(cardId) {
  const seeds = SEED_MESSAGES[cardId] || [];
  const mine = (STATE.localMessages || []).filter(m => m.cardId === cardId);
  return { seeds, mine };
}

function saveMsgToAuthor(cardId) {
  const ta = document.getElementById('msg-textarea-' + cardId);
  const errEl = document.getElementById('msg-error-' + cardId);
  if (!ta) return;
  const text = ta.value.trim();
  if (text.length < 4) {
    if (errEl) errEl.innerHTML = '<div class="error-box">至少写 4 个字。</div>';
    return;
  }
  if (!STATE.localMessages) STATE.localMessages = [];
  STATE.localMessages.push({
    id: 'msg-' + randomId(),
    cardId,
    text,
    date: new Date().toISOString().slice(0, 10),
    userId: getIdentity().id,
  });
  saveLocal();
  ta.value = '';
  if (errEl) errEl.innerHTML = '';
  // 重新渲染留言区
  const zone = document.getElementById('msg-zone-' + cardId);
  if (zone) zone.outerHTML = renderMsgToAuthor(cardId);
  toast('已留下你的话 ✓');
}

function renderMsgToAuthor(cardId) {
  const card = getCardById(cardId);
  if (!card) return '';
  const { seeds, mine } = getMsgsForCard(cardId);
  const all = [
    ...seeds.map(m => ({ ...m, isOwn: false })),
    ...mine.map(m => ({ ...m, isOwn: true })),
  ];
  const listHtml = all.length ? all.map(m => `
    <div class="msg-saved-item${m.isOwn ? ' is-own' : ''}">
      ${esc(m.text)}
      <div class="msg-meta">${m.isOwn ? '<span class="own-flag">你写的</span>' : '<span>另一位读者</span>'}<span>· ${esc(m.date)}</span>${m.isOwn ? `<button class="btn-text-sm" style="margin-left:8px;color:var(--muted);font-size:12px;" onclick="deleteMyMessage('${esc(m.id)}','${esc(cardId)}')">删除</button>` : ''}</div>
    </div>`).join('') : '';

  return `<div class="msg-to-author" id="msg-zone-${esc(cardId)}">
  <div class="msg-illus"><img class="illus" src="${ILLUS.envelope}" alt="" aria-hidden="true"></div>
  <div class="msg-body">
  <div class="msg-label">给 ${esc(card.authorName)} 留一句话</div>
  <div class="msg-notice">
    <span class="notice-pin" aria-hidden="true">📌</span>
    <span>目前这是静态演示版本——你写的话暂时只保存在你自己的浏览器里，卡主还收不到。
    后续接入后端后，会真正推送给他。你可以截图发给卡主，或者把这张卡分享给他。</span>
  </div>
  ${listHtml ? `<div class="msg-saved-list">${listHtml}</div>` : ''}
  <textarea id="msg-textarea-${esc(cardId)}" rows="3"
    placeholder="写下读完之后想说的话，不用很长…"></textarea>
  <div id="msg-error-${esc(cardId)}"></div>
  <div style="display:flex;gap:8px;margin-top:10px;">
    <button class="btn btn-quiet btn-sm" onclick="saveMsgToAuthor('${esc(cardId)}')">留下这句话</button>
  </div>
  </div>
</div>`;
}

// ===== AI 对话（以卡片和用户答案为上下文）=====

const AI_SYSTEM_PROMPT = `你是「刘看山」，一个话不多但很真诚的倾听者。
用户刚刚读完了一个真实的人生选择样本，并写下了自己的回答。
你的任务是陪用户「聊这个选择」——不是心理咨询，不是评价对错，只是一起想清楚。
规则：
- 用普通朋友的语气，不用「您」
- 绝不说教，不说「你应该」「建议你」「勇敢一点」「加油」
- 可以追问细节，可以说「我不太理解，你说的 XX 是什么意思」
- 每次回复 1-3 句，不要写长文
- 如果用户明显只是想发泄，就安静地接住，不急着给方向`;

function getAiContext(card, record) {
  let ctx = `卡主的选择：${card.title}\n`;
  ctx += `默认路径：${card.defaultPath}\n`;
  ctx += `实际选择：${card.divergence}\n`;
  ctx += `他当时最怕：${card.fear}\n`;
  if (record && record.answers && record.answers.length) {
    ctx += `\n用户自己的回答：\n`;
    record.answers.forEach(a => {
      ctx += `Q: ${a.question}\nA: ${a.answer}\n`;
    });
  }
  return ctx;
}

async function sendAiMessage(cardId) {
  const card = getCardById(cardId);
  if (!card) return;
  const record = getRecord(cardId);
  const inputEl = document.getElementById('ai-input-' + cardId);
  const msgZone = document.getElementById('ai-messages-' + cardId);
  const btn = document.getElementById('ai-send-btn-' + cardId);
  if (!inputEl || !msgZone) return;

  const userText = inputEl.value.trim();
  if (!userText) return;
  inputEl.value = '';

  if (!STATE.aiSessions) STATE.aiSessions = {};
  if (!STATE.aiSessions[cardId]) STATE.aiSessions[cardId] = [];
  STATE.aiSessions[cardId].push({ role: 'user', content: userText });

  // 渲染用户消息
  msgZone.innerHTML += `<div class="ai-msg user">${esc(userText)}</div>`;
  msgZone.innerHTML += `<div class="ai-msg loading" id="ai-loading-${esc(cardId)}"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>刘看山正在想…</div>`;
  msgZone.scrollTop = msgZone.scrollHeight;
  if (btn) btn.disabled = true;

  // 构建 messages
  const context = getAiContext(card, record);
  const messages = [
    { role: 'system', content: AI_SYSTEM_PROMPT + '\n\n背景信息：\n' + context },
    ...STATE.aiSessions[cardId],
  ];

  let replyText = '';
  let fromAi = false;

  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, max_tokens: 300 }),
    });
    const body = await res.json();
    if (body.text) { replyText = body.text; fromAi = true; }
  } catch {}

  if (!replyText) {
    // 本地兜底：根据对话轮数给不同的回应
    const turn = STATE.aiSessions[cardId].filter(m => m.role === 'user').length;
    const fallbacks = [
      `你刚才说的，我在想。\n有时候最难的不是做决定，是在做之前先承认自己真正想要什么。你现在知道自己想要什么吗？`,
      '嗯。\n你之前说过「' + esc(userText.slice(0, 20)) + '」……\n——这句话，你自己信吗？',
      `我没有答案。\n但我觉得你已经比你以为的清楚多了。`,
    ];
    replyText = fallbacks[Math.min(turn - 1, fallbacks.length - 1)];
  }

  STATE.aiSessions[cardId].push({ role: 'assistant', content: replyText });

  const loadingEl = document.getElementById('ai-loading-' + cardId);
  if (loadingEl) loadingEl.outerHTML = `<div class="ai-msg ai">${esc(replyText)}</div>`;
  msgZone.scrollTop = msgZone.scrollHeight;
  if (btn) btn.disabled = false;
  inputEl.focus();
}

function renderAiChat(cardId) {
  const card = getCardById(cardId);
  if (!card) return '';
  const sessions = (STATE.aiSessions && STATE.aiSessions[cardId]) || [];
  const historyHtml = sessions.map(m =>
    `<div class="ai-msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.content)}</div>`
  ).join('');

  return `<div class="ai-chat-panel">
  <div class="ai-chat-header" onclick="toggleAiChat('${esc(cardId)}')" id="ai-header-${esc(cardId)}">
    <span class="ai-label"><span class="lks" aria-hidden="true"></span>和刘看山聊聊这个选择<span class="ai-sub">读完之后，还可以再聊几句</span></span>
    <span class="ai-toggle" id="ai-toggle-${esc(cardId)}">▼</span>
  </div>
  <div id="ai-body-${esc(cardId)}" class="ai-chat-body" style="display:none;">
    <p class="ai-context-note">
      刘看山已经读过这张卡，也看到了你刚才写的回答。可以直接问他，也可以说说你自己现在的处境。
    </p>
    <div class="ai-messages" id="ai-messages-${esc(cardId)}">
      ${historyHtml || '<div class="ai-msg ai">你好。读完这张卡，有什么想聊的吗？</div>'}
    </div>
    <div class="ai-input-row">
      <textarea id="ai-input-${esc(cardId)}" placeholder="写下想问的或想说的…" rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMessage('${esc(cardId)}');}"></textarea>
      <button class="btn btn-sm" id="ai-send-btn-${esc(cardId)}"
        onclick="sendAiMessage('${esc(cardId)}')">发送</button>
    </div>
  </div>
</div>`;
}

function toggleAiChat(cardId) {
  const body = document.getElementById('ai-body-' + cardId);
  const header = document.getElementById('ai-header-' + cardId);
  const toggle = document.getElementById('ai-toggle-' + cardId);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  if (header) header.classList.toggle('open', !isOpen);
  if (toggle) toggle.textContent = isOpen ? '▼' : '▲';
}

  showView('home');

// 登录后把右上角「知乎登录」按钮更新为已登录状态（显示昵称）
function updateLoginButton() {
  var area = $('header-user-area');
  if (!area) return;
  var zh = getZhihuUser();
  if (zh && zh.name) {
    // 用内联实心底色+白字，避免渐变背景在部分渲染时机丢失导致文字看不清
    var style = 'display:inline-block;padding:6px 16px;border-radius:999px;'
      + 'background:#0066ff;color:#fff;font-size:13.5px;font-weight:500;'
      + 'text-decoration:none;box-shadow:0 4px 14px rgba(0,102,255,0.22);';
    area.innerHTML = '<a href="#" style="' + style + '" onclick="showLoginHint();return false;" title="已用知乎账号登录">✓ ' + esc(zh.name) + '</a>';
  }
}

document.addEventListener('DOMContentLoaded', init);
